# Zetik installed-system GRUB defaults.
# Managed drop-in: edit here, then run 'update-grub'. Never hand-edit grub.cfg.
GRUB_DISTRIBUTOR="Zetik OS"
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_THEME=/boot/grub/themes/zetik/theme.txt
GRUB_BACKGROUND=
GRUB_DISABLE_RECOVERY=false
# Text fallback colors if the theme cannot load
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/black"
