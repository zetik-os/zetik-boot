# Zetik Live GRUB menu (ISO). Consumed by the live image build.
if [ -s /boot/grub/themes/zetik/fallback-16.pf2 ]; then
  loadfont /boot/grub/themes/zetik/fallback-16.pf2
fi
for f in /boot/grub/themes/zetik/zetik-head-*.pf2; do
  if [ -s "$f" ]; then loadfont "$f"; fi
done
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm
set theme=/boot/grub/themes/zetik/theme.txt

set default=0
set timeout=10

menuentry "Start Zetik OS (Live)" {
  linux /live/vmlinuz boot=live components quiet splash
  initrd /live/initrd.img
}
menuentry "Start Zetik OS (safe graphics)" {
  linux /live/vmlinuz boot=live components nomodeset
  initrd /live/initrd.img
}
menuentry "Start Zetik OS (text mode)" {
  linux /live/vmlinuz boot=live components text
  initrd /live/initrd.img
}
menuentry "Install Zetik OS" {
  linux /live/vmlinuz boot=live components quiet calamares
  initrd /live/initrd.img
}
menuentry "Check disc for defects" {
  linux /live/vmlinuz boot=live components integrity-check
  initrd /live/initrd.img
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry "UEFI settings" { fwsetup }
fi
menuentry "Shut down" { halt }
